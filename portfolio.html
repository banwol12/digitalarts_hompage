<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Arts · Works</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap">
<style>
/* ═══ Cipher Design System — 색·간격·선·모션 토큰 (Claude Design 'digitalrarts_portpolio_site' 에서 동기화)
   서체만 사이트 조정: ABC Favorit/Arizona Mix 대체로 홈페이지와 같은 Pretendard 사용 ═══ */
:root{
  --black:#000000; --bone:#e9eae4; --mist:#e2e6e3;
  --bone-70:rgba(233,234,228,.7); --bone-45:rgba(233,234,228,.45); --bone-24:rgba(233,234,228,.24); --bone-12:rgba(233,234,228,.12); --bone-06:rgba(233,234,228,.06);
  --surface-page:var(--black); --surface-raised:var(--bone-06); --surface-invert:var(--bone);
  --text-body:var(--bone); --text-display:var(--mist); --text-muted:var(--bone-45); --text-meta:var(--bone-70); --text-invert:var(--black);
  --border-hairline:var(--bone-24); --border-faint:var(--bone-12);
  --link:var(--bone); --link-hover:var(--bone-45);
  --overlay-protect:linear-gradient(to bottom,rgba(0,0,0,.65),rgba(0,0,0,0));
  --font:"Pretendard","Noto Sans KR","Helvetica Neue",Arial,sans-serif;
  --text-10:10px; --text-12:12px; --text-16:16px; --text-20:20px; --text-28:28px; --text-40:40px;
  --track-tight:-.02em; --track-caps:.08em; --track-caps-wide:.16em;
  --space-2:8px; --space-7:7px; --space-15:15px; --space-3:16px; --space-4:24px; --space-5:32px; --space-40:40px; --space-6:48px; --space-8x:96px;
  --pm:40px; --hairline:1px; --z-nav:100; --z-overlay:200;
  --dur-fast:.2s; --dur-mid:.3s; --dur-slow:.45s; --ease:ease-out;
  --transition-link:opacity var(--dur-fast) var(--ease); --transition-media:opacity var(--dur-slow) var(--ease),transform var(--dur-slow) var(--ease);
  --marquee-duration:28s;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--black)}
body{margin:0;background:var(--surface-page);color:var(--text-body);font:500 var(--text-16)/1.35 var(--font);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:hidden}
a{color:var(--link);text-decoration:none;transition:var(--transition-link)}
a:hover{color:var(--link-hover)}
::selection{background:var(--bone);color:var(--black)}
img,video,canvas{display:block;max-width:100%}
h1,h2,h3,p,ul,figure{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:767px){:root{--pm:15px}}

.micro{font:500 var(--text-10)/1.6 var(--font);text-transform:uppercase;letter-spacing:var(--track-caps-wide);color:var(--text-muted)}
.caps{font:500 var(--text-12)/1.6 var(--font);text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--text-body)}
.label{font:500 var(--text-10)/1.6 var(--font);text-transform:uppercase;letter-spacing:var(--track-caps-wide);color:var(--text-muted)}
.display{font:500 clamp(1.6rem,3.2vw,2.75rem)/1.2 var(--font);letter-spacing:-.01em;color:var(--text-display);max-width:26ch;text-wrap:pretty}
.body{font:400 var(--text-16)/1.6 var(--font);color:var(--text-meta);max-width:46ch}
.navlink{font:500 var(--text-12)/1.2 var(--font);text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--text-body);opacity:.55;transition:var(--transition-link)}
.navlink:hover,.navlink.is-active{opacity:1;color:var(--text-body)}

/* ── 진입 로더 ── */
.entry{position:fixed;inset:0;z-index:var(--z-overlay);background:var(--black);display:grid;align-content:space-between;padding:var(--pm);transition:opacity var(--dur-slow) var(--ease)}
.entry.is-done{opacity:0;pointer-events:none}
.entry .wm{font:500 var(--text-16)/1 var(--font);letter-spacing:.14em;text-transform:uppercase}
.entry .strap{font:500 var(--text-12)/1.6 var(--font);text-transform:uppercase;letter-spacing:var(--track-caps-wide);color:var(--text-muted);text-align:center}
.entry .row{display:flex;justify-content:space-between;align-items:baseline;border-top:var(--hairline) solid var(--border-hairline);padding-top:10px}
.entry .pct{font:500 var(--text-12)/1 var(--font);font-variant-numeric:tabular-nums}

/* ── 헤더: 좌상단 마크+워드마크, 중앙 WORKS 하나 ── */
.hdr{position:fixed;inset:0 0 auto 0;z-index:var(--z-nav);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:15px var(--pm);background:linear-gradient(to bottom,rgba(0,0,0,.9),rgba(0,0,0,0))}
.brand{display:flex;align-items:center;gap:12px;color:var(--text-body)}
.brand:hover{color:var(--text-body)}
.brand .mark{width:30px;height:32px;flex:none}
.brand .mark svg{width:100%;height:100%;fill:currentColor}
.brand .word{font:500 var(--text-16)/1 var(--font);letter-spacing:.14em;text-transform:uppercase}
.hdr .center a{font:500 var(--text-16)/1.2 var(--font);color:var(--text-body);opacity:.55;transition:var(--transition-link)}
.hdr .center a:hover,.hdr .center a.is-active{opacity:1;color:var(--text-body)}

/* ── 홈: 별자리 궤도 (cipher.tv 첫 화면) ── */
.home{position:relative;height:100vh;height:100svh;overflow:hidden}
body.is-home{overflow:hidden;height:100vh;height:100svh}
.orbit{position:absolute;inset:0}
.tile{position:absolute;left:0;top:0;will-change:transform;cursor:pointer;background:#000;overflow:hidden}
.tile img,.tile canvas,.tile video{width:100%;height:100%;object-fit:cover;display:block;transition:filter var(--duration-normal) var(--ease-out),opacity var(--duration-normal) var(--ease-out)}
.home.is-hot .tile:not(.hot) > *{filter:grayscale(1) brightness(.62)}
.home .mark{position:absolute;left:50%;top:50%;width:44px;height:47px;transform:translate(-50%,-50%);color:var(--bone)}
.home .mark svg{fill:currentColor;width:100%;height:100%}
.home .foot{position:absolute;left:var(--pm);right:var(--pm);bottom:24px;display:grid;grid-template-columns:1fr auto 1fr;gap:15px;align-items:end;z-index:60;pointer-events:none}
.home .foot .l{min-height:1.4em;font-variant-numeric:tabular-nums;white-space:nowrap}
.home .foot .c{text-align:center}
.home .foot .r{text-align:right}

/* ── 페이지 공통 ── */
main{min-height:60vh}
.page{padding:120px var(--pm) 0}
.page.tight{padding-top:96px}

/* ── works: 큰 프레임을 세로로 쌓는 인덱스 ── */
.filters{display:flex;gap:18px;flex-wrap:wrap;margin:var(--space-40) 0 var(--space-6)}
.stackable{display:grid;gap:var(--space-6)}
.entry-work{display:grid;gap:10px;color:var(--text-body)}
.entry-work:hover{color:var(--text-body)}
.entry-work .well{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--surface-raised)}
.entry-work .well canvas,.entry-work .well img{width:100%;height:100%;object-fit:cover;transition:var(--transition-media)}
.entry-work:hover .well canvas,.entry-work:hover .well img{opacity:.72;transform:scale(1.02)}
.entry-work .cap{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-4)}
.entry-work .cap .n{font:500 var(--text-12)/1 var(--font);letter-spacing:.08em;color:var(--text-meta)}
.entry-work .cap .n::before{content:"";display:inline-block;width:6px;height:6px;background:var(--bone);margin-right:8px;vertical-align:middle}
.entry-work .cap .t{font:500 var(--text-20)/1.2 var(--font);text-transform:uppercase;letter-spacing:.02em;text-align:right}
.entry-work .cap .t small{display:block;font:400 var(--text-12)/1.4 var(--font);text-transform:none;letter-spacing:0;color:var(--text-muted)}

/* ── 상세 ── */
.work-head{display:flex;align-items:baseline;gap:15px;margin-bottom:var(--space-40);flex-wrap:wrap}
.work-title{font:600 clamp(2rem,6vw,4rem)/.98 var(--font);letter-spacing:-.02em;text-transform:uppercase}
.frame{display:grid;gap:var(--space-7)}
.frame .well{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--surface-raised)}
.frame.r219 .well{aspect-ratio:21/9}
.frame .well canvas,.frame .well img{width:100%;height:100%;object-fit:cover}
.frame .well.protect::after{content:"";position:absolute;inset:0;background:var(--overlay-protect);pointer-events:none}
.frame figcaption{display:flex;justify-content:space-between;gap:var(--space-2);font:500 var(--text-10)/1.6 var(--font);text-transform:uppercase;letter-spacing:var(--track-caps-wide);color:var(--text-muted)}
.section{margin-top:var(--space-8x);display:grid;grid-template-columns:200px 1fr;gap:var(--space-40);align-items:start}
.prose{display:grid;gap:var(--space-4);max-width:62ch}
.credits{display:grid;grid-template-columns:repeat(3,1fr);gap:32px 40px}
.credit{display:grid;gap:var(--space-7)}
.credit ul{display:grid;gap:2px}
.credit li{font:400 var(--text-12)/1.6 var(--font);color:var(--text-body)}
.rows{margin-top:var(--space-15)}
.row-item{display:grid;grid-template-columns:48px 1fr auto;align-items:baseline;gap:var(--space-15);padding:var(--space-15) 0;border-top:var(--hairline) solid var(--border-faint);color:var(--text-body);opacity:.78;transition:var(--transition-link)}
.row-item:hover{opacity:1;color:var(--text-body)}
.row-item .n{font:500 var(--text-12)/1.6 var(--font);font-variant-numeric:tabular-nums;color:var(--text-muted)}
.row-item .t{font:500 var(--text-16)/1.35 var(--font);text-transform:uppercase;letter-spacing:.04em}
.row-item .m{font:500 var(--text-10)/1.6 var(--font);text-transform:uppercase;letter-spacing:var(--track-caps-wide);color:var(--text-muted)}
.rows .row-item:last-child{border-bottom:var(--hairline) solid var(--border-faint)}
.back{display:inline-block;margin-bottom:var(--space-40)}

/* ── 마퀴·푸터 ── */
.marquee{overflow:hidden;width:100%}
.marquee .track{display:flex;width:max-content;gap:var(--space-4);font:500 var(--text-12)/1.6 var(--font);text-transform:uppercase;letter-spacing:var(--track-caps-wide);color:var(--text-body);white-space:nowrap;animation:mq var(--marquee-duration) linear infinite}
.marquee.big .track{gap:.18em;font:500 clamp(3.5rem,13vw,13rem)/.94 var(--font);letter-spacing:var(--track-tight)}
.marquee.rev .track{animation-direction:reverse}
.loader{display:flex;justify-content:space-between;align-items:baseline;max-width:320px;border-top:var(--hairline) solid var(--border-hairline);padding-top:10px;margin-bottom:var(--space-15)}
.loader .pct{font:500 var(--text-12)/1 var(--font);font-variant-numeric:tabular-nums}
.home-intro{display:grid;grid-template-columns:1.2fr 1fr;gap:var(--space-40);align-items:start;padding:var(--space-8x) var(--pm) 0}
.works-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:var(--space-40);align-items:start;margin-top:var(--space-8x)}
.preview{position:sticky;top:120px;opacity:0;transition:var(--transition-media)}
.preview.is-on{opacity:1}
.frame.r45 .well{aspect-ratio:4/5}
.filters{display:flex;gap:24px;flex-wrap:wrap;margin-top:var(--space-40)}
.filters a{font:500 var(--text-12)/1.6 var(--font);text-transform:uppercase;letter-spacing:var(--track-caps-wide);color:var(--text-body);opacity:.45;transition:var(--transition-link)}
.filters a:hover,.filters a.is-active{opacity:1;color:var(--text-body)}
.pill{display:inline-flex;align-items:center;font:500 var(--text-10)/1 var(--font);text-transform:uppercase;letter-spacing:var(--track-caps);padding:6px 12px;border:var(--hairline) solid var(--border-hairline);border-radius:999px;color:var(--text-body);background:rgba(0,0,0,.35)}
.player{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;padding:var(--space-15)}
.player .grp{display:flex;gap:var(--space-2)}
@keyframes mq{from{transform:translate3d(0,0,0)}to{transform:translate3d(-33.333%,0,0)}}
.ftr{border-top:var(--hairline) solid var(--border-faint);margin-top:var(--space-8x);padding:var(--space-40) var(--pm);display:grid;gap:32px}
.ftr .big{font:600 clamp(2.5rem,9vw,7rem)/.94 var(--font);letter-spacing:-.03em}
.ftr .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;align-items:start}
.ftr .cols .caption{font:400 var(--text-12)/1.6 var(--font);color:var(--text-meta)}
.ftr .bottom{display:flex;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;font:500 var(--text-10)/1 var(--font);text-transform:uppercase;letter-spacing:var(--track-caps);padding:8px 12px;border:var(--hairline) solid var(--border-hairline);color:var(--text-body)}
.btn:hover{color:var(--link-hover);border-color:var(--border-faint)}

@media (max-width:767px){
  .brand{gap:6px}
  .brand .mark{width:20px;height:22px}
  .brand .word{font-size:12px;letter-spacing:.1em;white-space:nowrap}
  .hdr .center a{font-size:12px}
  .page{padding-top:100px}
  .section{grid-template-columns:1fr;gap:var(--space-15)}
  .credits{grid-template-columns:1fr 1fr}
  .ftr .cols{grid-template-columns:1fr 1fr}
  .entry-work .cap .t{font-size:var(--text-16)}
  .row-item{grid-template-columns:40px 1fr auto}
  .home-intro{grid-template-columns:1fr;padding-top:var(--space-6)}
  .works-grid{grid-template-columns:1fr}
  .preview{display:none}
  .home .foot{grid-template-columns:1fr;gap:4px}
  .home .foot .c,.home .foot .r{text-align:left}
  .home .foot .c{display:none}
}
</style>

<script>
(function(){
  'use strict';
  var D = window.PORTFOLIO_DATA || { works: [], taglines: [], contact: {} };
  var app = document.getElementById('app');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var Q = new URLSearchParams(location.search), STATIC = Q.get('static') === '1';   /* 검수용: ?static=1 → 진입 화면 생략·한 프레임만, &ang=라디안, &hot=타일번호 */
  var raf = 0;

  /* 자리표시 썸네일: 검정 위 본색 픽셀 필드 (work.video → mp4/webm, work.image → jpg/gif 가 있으면 그것을 우선) */
  function media(work, w, h){
    if (work.video) { var v = document.createElement('video'); v.src = work.video; v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); if (work.image) v.poster = work.image; return v; }
    if (work.image) { var im = document.createElement('img'); im.src = work.image; im.alt = work.title; im.loading = 'lazy'; im.decoding = 'async'; return im; }
    var cv = document.createElement('canvas'); cv.width = w * 2; cv.height = h * 2; var g = cv.getContext('2d'); g.scale(2, 2);
    var seed = work.seed || 1; var rnd = function(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
    var cols = Math.max(8, Math.round(w / 14)), rows = Math.max(6, Math.round(h / 14)), cw = w / cols, ch = h / rows;
    var ccx = cols * (0.3 + rnd() * 0.4), ccy = rows * (0.3 + rnd() * 0.4), rr = Math.min(cols, rows) * (0.4 + rnd() * 0.22), stripes = 2 + Math.floor(rnd() * 4), ang = rnd() * Math.PI;
    var pal = ['rgba(233,234,228,.22)', 'rgba(233,234,228,.42)', 'rgba(233,234,228,.68)', 'rgba(233,234,228,.95)'];
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      var dx = c + 0.5 - ccx, dy = r + 0.5 - ccy, d = Math.sqrt(dx*dx + dy*dy);
      var band = Math.sin((dx * Math.cos(ang) + dy * Math.sin(ang)) * stripes * 0.9 + d * 0.5);
      var on = d < rr ? band > -0.35 : (d < rr + 3 && band > 0.55 && rnd() > 0.35);
      if (!on) continue;
      var shade = Math.max(0, Math.min(3, Math.floor((1 - d / (rr + 3)) * 3 + rnd() * 1.2)));
      g.fillStyle = pal[shade]; g.fillRect(c * cw + 0.5, r * ch + 0.5, cw - 1, ch - 1);
    }
    return cv;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function frame(work, cls, caption, index, protect){
    var f = document.createElement('figure'); f.className = 'frame' + (cls ? ' ' + cls : '');
    var well = document.createElement('div'); well.className = 'well' + (protect ? ' protect' : '');
    well.appendChild(media(work, cls === 'r219' ? 840 : cls === 'r45' ? 400 : 640, cls === 'r219' ? 360 : cls === 'r45' ? 500 : 360)); f.appendChild(well);
    if (caption || index) { var fc = document.createElement('figcaption'); fc.innerHTML = '<span>' + esc(caption || '') + '</span><span>' + esc(index || '') + '</span>'; f.appendChild(fc); }
    return f;
  }
  function rowItem(w){ return '<a class="row-item" href="#/work/' + w.slug + '"><span class="n">' + w.n + '</span><span class="t">' + esc(w.title) + '</span><span class="m">' + esc(w.student) + ' · ' + w.meta + '</span></a>'; }
  function marquee(items, big, rev){ var run = items.concat(items, items).map(function(t){ return '<span>' + esc(t) + '</span>'; }).join(''); return '<div class="marquee' + (big ? ' big' : '') + (rev ? ' rev' : '') + '"><div class="track">' + run + '</div></div>'; }
  function footer(){
    var C = D.contact || {};
    return '<footer class="ftr"><div class="big">DIGITAL ARTS</div><div class="cols">' +
      '<div class="caption">' + (C.address || []).map(esc).join('<br>') + '</div>' +
      '<div class="caption">for the screen<br>and beyond</div>' +
      '<div><div class="label">work with us</div><div style="margin-top:7px"><a class="btn" href="' + (C.email && C.email.indexOf('@') > 0 ? 'mailto:' + C.email : '#') + '">' + esc(C.email || '[전공 이메일]') + '</a></div></div>' +
      '<div style="display:grid;gap:7px;justify-items:start"><a class="btn" href="' + (C.instagram || '#') + '">instagram</a><a class="btn" href="' + (C.youtube || '#') + '">youtube</a></div>' +
      '</div><div class="bottom micro"><span>© seoul institute of the arts · digital arts ' + new Date().getFullYear() + '</span><a class="micro" href="index.html">back to main site</a></div></footer>';
  }

  /* ── 홈: cipher.tv 첫 화면 — 대표 이미지·GIF·영상이 기울어진 타원 궤도(별자리)를 천천히 돌고, 휠·터치가 회전 속도와 방향을 바꾼다.
     궤도 형태는 화면 녹화본에서 잰 값: 가로:세로 = 1:0.7, 오른쪽이 살짝 올라간 −14° 기울기, 왼쪽 아래가 가장 가깝다(크고 앞에 온다). */
  var spin = { vel: 0, ang: 0, last: 0, dir: -1 };                                /* dir: 손대지 않을 때의 회전 방향 (−1 = 반시계, 녹화본과 같음) */
  var SCRAMBLE = '0123456789/·—ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  function Home(){
    cancelAnimationFrame(raf);
    document.body.classList.add('is-home');
    app.innerHTML = '<section class="home" id="home"><div class="orbit" id="orbit"></div><div class="mark" aria-hidden="true"><svg><use href="#logo"/></svg></div>' +
      '<div class="foot micro"><span class="l" id="tagline"></span><span class="c">' + esc(D.strapline || '') + '</span><span class="r">seoul institute of the arts · digital arts</span></div></section>';
    var orbit = document.getElementById('orbit'), home = document.getElementById('home'), tagEl = document.getElementById('tagline');
    var works = D.works.slice(0, 15), N = works.length, tiles = [];
    var ratios = [[16, 10], [4, 5], [3, 2], [1, 1], [16, 9], [4, 5], [16, 10], [5, 4]];   /* 작품마다 다른 화면비 (data의 ratio:[w,h] 로 덮어쓸 수 있음) */
    works.forEach(function(w, i){
      var r = (w.ratio && w.ratio.length === 2) ? w.ratio : ratios[i % ratios.length], ar = r[0] / r[1];
      var t = document.createElement('a'); t.className = 'tile'; t.href = '#/work/' + w.slug; t.setAttribute('aria-label', w.title);
      t.appendChild(media(w, 480, Math.round(480 / ar)));
      var tl = { el: t, ar: ar, kw: ar >= 1.4 ? 0.72 : ar >= 1 ? 0.55 : 0.46, a: (i / N) * Math.PI * 2, j: (((i * 7) % 5) - 2) * 0.035, hs: 1, hot: false };
      t.addEventListener('mouseenter', function(){ home.classList.add('is-hot'); t.classList.add('hot'); tl.hot = true; });
      t.addEventListener('mouseleave', function(){ home.classList.remove('is-hot'); t.classList.remove('hot'); tl.hot = false; });
      orbit.appendChild(t); tiles.push(tl);
    });
    var tags = (D.taglines || []).map(function(t){ return String(t).toLowerCase(); }), tagI = -1, tagT = -1e9;
    if (!tags.length) tags = [String(D.strapline || '').toLowerCase()];
    spin.last = performance.now();
    if (STATIC) { spin.ang = parseFloat(Q.get('ang') || '0') || 0; var hi = parseInt(Q.get('hot') || '-1', 10); if (tiles[hi]) { tiles[hi].hot = true; tiles[hi].hs = 1.25; tiles[hi].el.classList.add('hot'); home.classList.add('is-hot'); } }
    var ROT = -14 * Math.PI / 180, NEAR = 110 * Math.PI / 180, cr = Math.cos(ROT), sr = Math.sin(ROT);
    function frameFn(now){
      var W = window.innerWidth, H = window.innerHeight, small = W < 768;
      var dt = Math.min(0.05, (now - spin.last) / 1000); spin.last = now;
      var base = (reduce || STATIC) ? 0 : (Math.PI * 2 / 90) * spin.dir;                        /* 손대지 않으면 90초에 한 바퀴 */
      spin.ang += (base + spin.vel) * dt;
      spin.vel *= Math.pow(0.25, dt);                                                 /* 휠·터치로 얻은 속도는 2초쯤에 걸쳐 사라진다 */
      var A = small ? W * 0.40 : Math.min(W * 0.31, H * 0.40), B = A * (small ? 1.15 : 0.70);
      var cx = W / 2, cy = H * (small ? 0.47 : 0.5);
      B = Math.min(B, cy - 64 - A * 0.2);                                            /* 좁고 긴 창: 맨 위 타일이 헤더를 덮지 않게 */
      tiles.forEach(function(tl){
        var ang = tl.a + spin.ang;
        var d = Math.cos(ang - NEAR);                                                 /* 1 = 가장 가까움(왼쪽 아래), −1 = 가장 멂(오른쪽 위) */
        var s = 0.85 + 0.15 * d, p = 0.92 + 0.08 * d;                                 /* 앞은 크고 바깥으로, 뒤는 작고 안쪽으로 */
        var x0 = Math.cos(ang) * A, y0 = Math.sin(ang) * B + tl.j * B;
        var x = cx + (x0 * cr - y0 * sr) * p, y = cy + (x0 * sr + y0 * cr) * p;
        tl.hs += ((tl.hot ? 1.25 : 1) - tl.hs) * Math.min(1, dt * 9);
        var tw = A * tl.kw * (small ? 1.18 : 1) * s * tl.hs, th = tw / tl.ar;
        tl.el.style.transform = 'translate3d(' + (x - tw / 2).toFixed(1) + 'px,' + (y - th / 2).toFixed(1) + 'px,0)';
        tl.el.style.width = tw.toFixed(1) + 'px'; tl.el.style.height = th.toFixed(1) + 'px';
        tl.el.style.zIndex = tl.hot ? '55' : String(1 + Math.round((d + 1) * 25));  /* 1–51: 헤더(100)·진입 화면(200)보다 항상 아래 */
      });
      /* 왼쪽 아래 태그라인: 6초마다 다음 문장으로, 글자가 흩어졌다가 자리 잡는다 */
      if (now - tagT > 6000) { tagI = (tagI + 1) % tags.length; tagT = now; }
      var txt = tags[tagI], pr = (reduce || STATIC) ? 1 : Math.min(1, (now - tagT) / 900), n = Math.floor(pr * txt.length), out = '';
      for (var i = 0; i < txt.length; i++) out += (i < n || txt[i] === ' ') ? txt[i] : SCRAMBLE[Math.floor(Math.random() * SCRAMBLE.length)].toLowerCase();
      if (pr < 1 || tagEl.textContent !== txt) tagEl.textContent = out;
      if (!STATIC) raf = requestAnimationFrame(frameFn);
    }
    if (STATIC) frameFn(spin.last + 16); else raf = requestAnimationFrame(frameFn);
  }
  /* 휠: 아래로 굴리면 시계 방향으로 빨라지고, 위로 굴리면 반대로 돈다. 터치: 쓸어 넘긴 방향으로. 마지막으로 민 방향이 그 뒤의 느린 회전 방향이 된다 */
  function push(v){ spin.vel = Math.max(-2.6, Math.min(2.6, spin.vel + v)); if (Math.abs(v) > 0.003) spin.dir = v > 0 ? 1 : -1; }
  window.addEventListener('wheel', function(e){ if (!document.body.classList.contains('is-home')) return; e.preventDefault(); push((e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY) * 0.0028); }, { passive: false });
  var tY = null, tX = null;
  window.addEventListener('touchstart', function(e){ var t = e.touches[0]; tY = t.clientY; tX = t.clientX; }, { passive: true });
  window.addEventListener('touchmove', function(e){ if (!document.body.classList.contains('is-home') || tY === null) return; var t = e.touches[0]; var dy = tY - t.clientY, dx = tX - t.clientX; tY = t.clientY; tX = t.clientX; e.preventDefault(); push((dy + dx) * 0.014); }, { passive: false });
  window.addEventListener('touchend', function(){ tY = null; }, { passive: true });

  /* ── works: 큰 프레임 세로 스택 ── */
  function Works(filter){
    cancelAnimationFrame(raf); document.body.classList.remove('is-home');
    filter = filter || 'all';
    var metas = ['all'].concat(D.works.map(function(w){ return w.meta; }).filter(function(m, i, a){ return a.indexOf(m) === i; }));
    var list = D.works.filter(function(w){ return filter === 'all' || w.meta === filter; });
    app.innerHTML = '<section class="page"><h1 class="display" style="max-width:30ch">' + esc((D.statement || []).join(' ')) + '</h1>' +
      '<div class="filters">' + metas.map(function(m){ return '<a class="' + (m === filter ? 'is-active' : '') + '" href="#/works/' + m + '">' + m + '</a>'; }).join('') + '</div>' +
      '<div class="works-grid"><div class="rows" id="rows">' + list.map(rowItem).join('') + (list.length ? '' : '<p class="body">이 분야의 작품이 아직 없습니다.</p>') + '</div><div class="preview" id="preview"></div></div></section>' + footer();
    var pv = document.getElementById('preview');
    Array.prototype.forEach.call(document.querySelectorAll('#rows .row-item'), function(a){
      a.addEventListener('mouseenter', function(){ var w = D.works.filter(function(x){ return '#/work/' + x.slug === a.getAttribute('href'); })[0]; if (!w) return; pv.innerHTML = ''; pv.appendChild(frame(w, 'r45', w.title, w.n)); pv.classList.add('is-on'); });
      a.addEventListener('mouseleave', function(){ pv.classList.remove('is-on'); });
    });
  }

  /* ── 상세 ── */
  function Work(slug){
    cancelAnimationFrame(raf); document.body.classList.remove('is-home');
    var w = D.works.filter(function(x){ return x.slug === slug; })[0] || D.works[0]; if (!w) { Works(); return; }
    var more = D.works.filter(function(x){ return x.slug !== w.slug; }).slice(0, 3);
    app.innerHTML = '<section class="page tight"><a class="navlink back" href="#/works">← works</a>' +
      '<div class="work-head"><span class="label">' + w.n + '</span><h1 class="work-title">' + esc(w.title) + '</h1></div><div id="hero"></div>' +
      '<section class="section"><div class="label">about</div><div class="prose"><h2 class="display">' + esc(w.statement) + '</h2>' + (w.paragraphs || []).map(function(p){ return '<p class="body">' + esc(p) + '</p>'; }).join('') + '</div></section>' +
      '<section style="margin-top:var(--space-8x)" id="second"></section>' +
      '<section class="section"><div class="label">credits</div><div class="credits">' +
        '<div class="credit"><div class="label">student</div><ul><li>' + esc(w.student) + '</li></ul></div>' +
        '<div class="credit"><div class="label">discipline</div><ul><li>' + w.meta + '</li></ul></div>' +
        '<div class="credit"><div class="label">year</div><ul><li>' + esc(w.year) + '</li></ul></div>' +
        '<div class="credit"><div class="label">tools</div><ul>' + (w.tools || []).map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>' +
        '<div class="credit"><div class="label">advisor</div><ul><li>[지도교수]</li></ul></div>' +
        '<div class="credit"><div class="label">exhibition</div><ul><li>[전시·상영 정보]</li></ul></div>' +
      '</div></section>' +
      '<section style="margin-top:var(--space-8x)"><div class="label">more to discover</div><div class="rows">' + more.map(rowItem).join('') + '</div></section></section>' + footer();
    document.getElementById('hero').appendChild(frame(w, '', w.title, w.n));
    var second = frame(w, 'r219', '', '', true);
    second.querySelector('.well').insertAdjacentHTML('beforeend', '<div class="player"><span class="pill">play</span><span class="grp"><span class="pill">sound : off</span><span class="pill">full screen</span></span></div>');
    document.getElementById('second').appendChild(second);
  }

  function route(){
    var h = location.hash.replace(/^#\/?/, ''), parts = h.split('/'), name = parts[0] || 'home';
    if (name === 'works') Works(parts[1]); else if (name === 'work') Work(parts[1]); else Home();
    var c = document.querySelector('.hdr .center a'); if (c) c.classList.toggle('is-active', name === 'works' || name === 'work');
    window.scrollTo(0, 0);
  }
  /* ── 데이터: config.js 에 Supabase 연결이 있으면 관리자 페이지(admin.html)에서 저장한 작품·사이트 정보를 쓰고,
     연결이 없거나 아직 작품이 없으면 portfolio-data.js 의 자리표시 데이터를 쓴다 ── */
  function pad3(n){ return ('00' + n).slice(-3); }
  function applyRemote(rows, site){
    if (rows && rows.length) D.works = rows.map(function(r, i){
      var rt = String(r.ratio || '16:10').split(':').map(Number);
      return { n: pad3(i + 1), slug: r.slug, title: r.title || '', student: r.student || '', meta: r.category || 'installation', year: r.year || '', tools: r.tools || [],
        statement: r.statement || '', paragraphs: r.paragraphs || [], seed: i * 7 + 3, ratio: (rt.length === 2 && rt[0] > 0 && rt[1] > 0) ? rt : null, image: r.image || '', video: r.video || '' };
    });
    (site || []).forEach(function(row){ if (row.value != null && row.value !== '' && !(Array.isArray(row.value) && !row.value.length)) D[row.key] = row.value; });
  }
  function loadRemote(done){
    var C = window.SITE_CONFIG || {};
    if (STATIC || !C.SUPABASE_URL || !C.SUPABASE_ANON_KEY || typeof fetch !== 'function') return done();
    var h = { apikey: C.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + C.SUPABASE_ANON_KEY }, base = C.SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/';
    var started = false, start = function(){ if (!started) { started = true; done(); } };
    var late = setTimeout(start, 4000);                                             /* 4초 안에 안 오면 자리표시 데이터로 먼저 연다 */
    Promise.all([
      fetch(base + 'works?select=*&published=eq.true&order=sort.asc,created_at.asc', { headers: h }).then(function(r){ return r.ok ? r.json() : []; }),
      fetch(base + 'site?select=key,value', { headers: h }).then(function(r){ return r.ok ? r.json() : []; })
    ]).then(function(res){ clearTimeout(late); applyRemote(res[0], res[1]); if (started) route(); else start(); }, start);
  }
  loadRemote(function(){ window.addEventListener('hashchange', route); route(); });

  /* ── 진입: 퍼센트 카운터 → 페이드 (세션당 한 번) ── */
  var entry = document.getElementById('entry'), pct = document.getElementById('pct');
  if (D.strapline) document.getElementById('strap').textContent = D.strapline;
  var seen = false; try { seen = !!sessionStorage.getItem('pf-entered'); } catch (e) {}
  if (reduce || seen || STATIC) entry.classList.add('is-done');
  if (STATIC) entry.style.display = 'none';
  else {
    var e0 = performance.now();
    (function tick(now){ var p = Math.min(1, (now - e0) / 900); pct.textContent = Math.round(p * 100) + '%'; if (p < 1) requestAnimationFrame(tick); else setTimeout(function(){ entry.classList.add('is-done'); }, 150); })(e0);
    try { sessionStorage.setItem('pf-entered', '1'); } catch (e) {}
  }
})();
</script>
