<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Arts · Submit</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
/* 작품 게시 페이지 — 포트폴리오·관리자와 같은 Cipher 토큰(검정·본색·헤어라인), Pretendard */
:root{--black:#000;--bone:#e9eae4;--b70:rgba(233,234,228,.7);--b45:rgba(233,234,228,.45);--b24:rgba(233,234,228,.24);--b12:rgba(233,234,228,.12);--b6:rgba(233,234,228,.06);--warn:#ff6b57;--key:#f4ff53;--font:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--pm:40px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--black);color:var(--bone);font:400 14px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1{font:500 clamp(1.6rem,3.2vw,2.75rem)/1.2 var(--font);letter-spacing:-.01em;margin:0;max-width:26ch}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--b45)}
.hdr{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:15px var(--pm);background:linear-gradient(to bottom,rgba(0,0,0,.95),rgba(0,0,0,.85))}
.brand{display:flex;align-items:center;gap:12px;font-weight:500;font-size:16px;letter-spacing:.14em;text-transform:uppercase}
.brand .mark{width:30px;height:32px;flex:none}
.brand .mark svg{width:100%;height:100%;fill:currentColor}
.hdr .center{display:flex;gap:24px;justify-content:center;font-size:16px}
.hdr .center a{color:var(--bone);opacity:.55;transition:opacity .2s}
.hdr .center a:hover,.hdr .center a.is-active{opacity:1}
.wrap{padding:48px var(--pm) 120px;max-width:1040px}
.intro{display:grid;gap:14px;margin-bottom:48px}
.intro p{color:var(--b70);max-width:52ch;margin:0}
.mode{border:1px solid rgba(244,255,83,.35);color:var(--key);padding:10px 14px;font-size:12px;margin-bottom:32px;max-width:640px}
.form{display:grid;gap:26px;max-width:760px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.field{display:grid;gap:6px}
.field input,.field select,.field textarea{width:100%;background:none;border:0;border-bottom:1px solid var(--b24);padding:8px 0;outline:0;border-radius:0;color:var(--bone)}
.field input:focus,.field select:focus,.field textarea:focus{border-bottom-color:var(--bone)}
.field select option{background:#111;color:var(--bone)}
.field textarea{resize:vertical;min-height:72px;line-height:1.6}
.field .hint{font-size:11px;color:var(--b45)}
.field.is-bad input,.field.is-bad select,.field.is-bad textarea{border-bottom-color:var(--warn)}
.req::after{content:" *";color:var(--key)}
.media{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
.media .well{aspect-ratio:16/10;background:var(--b6);border:1px solid var(--b12);overflow:hidden;display:grid;place-items:center;color:var(--b24);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.media .well img,.media .well video{width:100%;height:100%;object-fit:cover;display:block}
.media .file{display:grid;gap:10px;font-size:12px;color:var(--b70)}
.media input[type=file]{max-width:100%}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;cursor:pointer;color:var(--b70)}
.check input{accent-color:var(--bone);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--b24);padding:10px 16px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:var(--bone);border-radius:0}
.btn:hover{border-color:var(--bone)}
.btn.primary{background:var(--bone);color:var(--black);border-color:var(--bone)}
.btn.primary:hover{background:#fff}
.btn:disabled{opacity:.4;cursor:default}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding-top:20px;border-top:1px solid var(--b12)}
.msg{font-size:12px;color:var(--b70);min-height:1.6em}
.msg.err{color:var(--warn)}
.done{display:grid;gap:24px;max-width:640px}
.done .card{border:1px solid var(--b12);padding:20px;display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:start}
.done .card .well{aspect-ratio:16/10;background:var(--b6);overflow:hidden}
.done .card img,.done .card video{width:100%;height:100%;object-fit:cover;display:block}
.done .card .t{display:grid;gap:4px}
.done .card .t b{font-weight:500;font-size:16px}
.done .card .t small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--b45)}
.ftr{border-top:1px solid var(--b12);padding:24px var(--pm);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--b45)}
@media (max-width:767px){:root{--pm:15px}.brand{gap:6px;font-size:12px;letter-spacing:.1em;white-space:nowrap}.brand .mark{width:20px;height:22px}.hdr .center{font-size:12px}.grid2{grid-template-columns:1fr}.media{grid-template-columns:1fr}.wrap{padding-top:32px}.done .card{grid-template-columns:1fr}}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logo" viewBox="0 0 32 34"><rect width="32" height="34" fill="none"/><path id="logo-path"/></symbol></svg>
<header class="hdr">
  <a class="brand" href="portfolio.html" aria-label="포트폴리오 첫 화면으로"><span class="mark"><svg><use href="#logo"/></svg></span><span>Digital Arts</span></a>
  <nav class="center"><a href="portfolio.html#/works">/works</a><a class="is-active" href="submit.html">/submit</a></nav>
  <span></span>
</header>
<main class="wrap" id="app"></main>
<footer class="ftr"><span>© seoul institute of the arts · digital arts</span><a href="portfolio.html">back to portfolio</a></footer>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="portfolio-api.js"></script>
<script>
(function(){
  'use strict';
  var API = window.PortfolioAPI, app = document.getElementById('app');
  var MAX_IMG = 15 * 1024 * 1024, MAX_VID = 50 * 1024 * 1024;
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function errText(e){ return (e && (e.message || e.error_description || e.msg)) || String(e); }

  /* 로고 픽셀 (홈페이지와 같은 32×34 격자) */
  fetch('logo-grid.json').then(function(r){ return r.ok ? r.json() : null; }).then(function(g){
    if (!g) return; var rows = g.rows || g, d = '';
    rows.forEach(function(row, y){ String(row).split('').forEach(function(ch, x){ if (ch !== '.' && ch !== ' ' && ch !== '0') d += 'M' + x + ' ' + y + 'h1v1h-1z'; }); });
    var p = document.getElementById('logo-path'); if (p) p.setAttribute('d', d);
  }).catch(function(){});

  function field(label, name, value, opts){
    opts = opts || {};
    var inner;
    if (opts.select) inner = '<select name="' + name + '">' + opts.select.map(function(o){ return '<option value="' + esc(o) + '"' + (o === value ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
    else if (opts.textarea) inner = '<textarea name="' + name + '" rows="' + (opts.rows || 3) + '" placeholder="' + esc(opts.placeholder || '') + '">' + esc(value || '') + '</textarea>';
    else inner = '<input type="' + (opts.type || 'text') + '" name="' + name + '" value="' + esc(value || '') + '" placeholder="' + esc(opts.placeholder || '') + '"' + (opts.attrs || '') + '>';
    return '<label class="field" data-f="' + name + '"><span class="label' + (opts.req ? ' req' : '') + '">' + esc(label) + '</span>' + inner + (opts.hint ? '<span class="hint">' + esc(opts.hint) + '</span>' : '') + '</label>';
  }
  function media(kind, req){
    var isVideo = kind === 'video';
    return '<div class="field" data-f="' + kind + '"><span class="label' + (req ? ' req' : '') + '">' + (isVideo ? 'video · 영상 (mp4 · webm, 50MB 이하)' : 'image · 대표 이미지 (jpg · png · gif, 15MB 이하)') + '</span>' +
      '<div class="media"><div class="well" id="well-' + kind + '">' + (isVideo ? 'no video' : 'no image') + '</div>' +
      '<div class="file"><input type="file" name="' + kind + '" accept="' + (isVideo ? 'video/mp4,video/webm' : 'image/*') + '">' +
      '<span class="hint">' + (isVideo ? '있으면 첫 화면 궤도와 작품 페이지에서 소리 없이 반복 재생됩니다. 없어도 됩니다.' : '첫 화면 궤도의 타일과 목록 미리보기에 쓰입니다. 움직이는 GIF 도 됩니다.') + '</span></div></div></div>';
  }

  function Form(){
    app.innerHTML = '<div class="intro"><span class="label">submit</span><h1>작품 게시</h1><p>서울예술대학교 디지털아트전공 학생이라면 누구나 작품을 올릴 수 있습니다. 제출한 작품은 전공에서 검토한 뒤 포트폴리오 사이트에 게시됩니다. 결과는 적어 주신 이메일로 알려 드립니다.</p></div>' +
      (API.mode === 'local' ? '<div class="mode">' + esc(API.label) + '</div>' : '') +
      '<form class="form" id="sf" novalidate>' +
      '<div class="grid2">' + field('title · 작품 제목', 'title', '', { req: true }) + field('student · 이름', 'student', '', { req: true }) + '</div>' +
      '<div class="grid2">' + field('email · 이메일', 'email', '', { req: true, type: 'email', placeholder: 'name@seoularts.ac.kr', hint: '검토 결과를 알려 드릴 주소. 사이트에는 표시되지 않습니다.' }) + field('category · 분야', 'category', API.CATS[0], { select: API.CATS, req: true }) + '</div>' +
      '<div class="grid2">' + field('year · 제작 연도', 'year', '', { placeholder: String(new Date().getFullYear()) }) + field('tools · 도구', 'tools', '', { placeholder: 'TouchDesigner, Kinect', hint: '쉼표로 구분' }) + '</div>' +
      field('statement · 작품을 한 문장으로', 'statement', '', { textarea: true, rows: 2, req: true }) +
      field('description · 작품 설명', 'paragraphs', '', { textarea: true, rows: 7, hint: '작품 개요 · 제작 과정 · 결과. 문단은 빈 줄로 구분합니다.' }) +
      media('image', true) + media('video', false) +
      field('ratio · 첫 화면 타일 화면비', 'ratio', '16:10', { select: API.RATIOS, hint: '이미지를 고르면 가장 가까운 비율이 자동으로 선택됩니다' }) +
      field('note · 전공에 전할 말', 'submitter_note', '', { textarea: true, rows: 2, placeholder: '전시 이력, 공동 제작자, 참고 링크 등' }) +
      '<label class="check"><input type="checkbox" name="agree"> 제출한 작품과 이미지·영상이 디지털아트전공 포트폴리오 사이트에 게시되는 데 동의합니다. 저작권은 제작자에게 있으며, 요청하면 내릴 수 있습니다.</label>' +
      '<div class="actions"><button class="btn primary" type="submit">제출</button><span class="msg" id="msg"></span></div></form>';
    bind();
  }

  function bind(){
    var f = document.getElementById('sf'), msg = document.getElementById('msg');
    var files = { image: null, video: null };
    ['image', 'video'].forEach(function(kind){
      var fi = f.elements[kind], well = document.getElementById('well-' + kind);
      fi.addEventListener('change', function(){
        var file = fi.files && fi.files[0]; files[kind] = null;
        if (!file) { well.textContent = 'no ' + kind; return; }
        if (file.size > (kind === 'video' ? MAX_VID : MAX_IMG)) { setBad(kind, '파일이 너무 큽니다.'); fi.value = ''; well.textContent = 'no ' + kind; return; }
        setBad(kind, '');
        files[kind] = file;
        var url = URL.createObjectURL(file);
        if (kind === 'video') well.innerHTML = '<video src="' + url + '" muted loop autoplay playsinline></video>';
        else {
          var im = new Image();
          im.onload = function(){ f.elements.ratio.value = API.closestRatio(im.naturalWidth, im.naturalHeight); };
          im.src = url; im.alt = ''; well.innerHTML = ''; well.appendChild(im);
        }
      });
    });
    function setBad(name, text){ var el = f.querySelector('[data-f="' + name + '"]'); if (!el) return; el.classList.toggle('is-bad', !!text); if (text) { msg.className = 'msg err'; msg.textContent = text; } }
    f.addEventListener('submit', function(e){
      e.preventDefault();
      var g = function(n){ return f.elements[n].value.trim(); };
      var bad = null;
      Array.prototype.forEach.call(f.querySelectorAll('.field'), function(el){ el.classList.remove('is-bad'); });
      if (!g('title')) bad = ['title', '작품 제목을 적어 주세요.'];
      else if (!g('student')) bad = ['student', '이름을 적어 주세요.'];
      else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g('email'))) bad = ['email', '이메일 주소를 확인해 주세요.'];
      else if (!g('statement')) bad = ['statement', '작품을 한 문장으로 적어 주세요.'];
      else if (!files.image) bad = ['image', '대표 이미지를 골라 주세요.'];
      else if (!f.elements.agree.checked) bad = ['agree', '게시 동의에 체크해 주세요.'];
      if (bad) { setBad(bad[0], bad[1]); if (bad[0] === 'agree') { msg.className = 'msg err'; msg.textContent = bad[1]; } return; }

      var slug = 'sub-' + Date.now().toString(36);
      var row = { slug: slug, title: g('title'), student: g('student'), submitter_email: g('email'), submitter_note: g('submitter_note') || null,
        category: g('category'), year: g('year'), tools: g('tools').split(',').map(function(s){ return s.trim(); }).filter(Boolean),
        statement: g('statement'), paragraphs: g('paragraphs').split(/\n\s*\n/).map(function(s){ return s.trim(); }).filter(Boolean),
        ratio: g('ratio'), image: null, video: null };
      var btn = f.querySelector('button[type=submit]'); btn.disabled = true; msg.className = 'msg'; msg.textContent = '이미지 올리는 중…';
      var skippedVideo = false;
      API.upload(files.image, API.mediaPath('submissions', slug, 'image', files.image)).then(function(url){
        row.image = url;
        if (!files.video) return null;
        msg.textContent = '영상 올리는 중…';
        return API.upload(files.video, API.mediaPath('submissions', slug, 'video', files.video)).then(function(v){ row.video = v; }, function(err){ if (API.mode === 'local') { skippedVideo = true; return null; } throw err; });
      }).then(function(){ msg.textContent = '제출하는 중…'; return API.submitWork(row); })
        .then(function(saved){ Done(saved || row, skippedVideo); window.scrollTo(0, 0); })
        .catch(function(err){ btn.disabled = false; msg.className = 'msg err'; msg.textContent = '제출하지 못했습니다: ' + errText(err); });
    });
  }

  function Done(w, skippedVideo){
    app.innerHTML = '<div class="done"><span class="label">submitted</span><h1>제출되었습니다</h1>' +
      '<p style="color:var(--b70);margin:0">전공에서 검토한 뒤 사이트에 게시됩니다. 결과는 <b style="font-weight:500;color:var(--bone)">' + esc(w.submitter_email) + '</b> 로 알려 드립니다.' + (skippedVideo ? '<br><span style="color:var(--key)">미리보기 모드라 영상은 저장되지 않았습니다.</span>' : '') + '</p>' +
      '<div class="card"><div class="well">' + (w.video ? '<video src="' + esc(w.video) + '" muted loop autoplay playsinline></video>' : w.image ? '<img src="' + esc(w.image) + '" alt="">' : '') + '</div>' +
      '<div class="t"><small>' + esc(w.category) + (w.year ? ' · ' + esc(w.year) : '') + '</small><b>' + esc(w.title) + '</b><span style="color:var(--b70)">' + esc(w.student) + '</span><span style="color:var(--b45);font-size:12px">' + esc(w.statement) + '</span></div></div>' +
      '<div class="actions" style="border:0;padding:0"><button class="btn" type="button" id="again">다른 작품 제출</button><a class="btn" href="portfolio.html">포트폴리오 보기 ↗</a></div></div>';
    document.getElementById('again').addEventListener('click', Form);
  }

  Form();
})();
</script>
</html>
